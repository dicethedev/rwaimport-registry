name: Monitor registry sources

on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official source drift
        run: npm run check:source-drift

      - name: Check SEC underlying metadata drift
        run: npm run check:underlyings:sec

      - name: Check source and verification links
        run: npm run check:links

      - name: Verify deployments onchain
        run: npm run verify:onchain
